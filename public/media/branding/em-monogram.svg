<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="100%" stop-color="#173B85" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="8" fill="url(#inkGrad)" />
  
  <!-- Subtle gold hairline inner frame -->
  <rect x="6" y="6" width="116" height="116" rx="4" fill="none" stroke="#A66A18" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Monogram EM Typography -->
  <text x="64" y="80" 
        font-family="'Newsreader', Georgia, 'Times New Roman', serif" 
        font-size="64" 
        font-weight="500" 
        font-style="normal" 
        fill="#F8F7F4" 
        text-anchor="middle" 
        letter-spacing="1">EM</text>
  
  <!-- Gold Accent Dot -->
  <circle cx="102" cy="46" r="3.5" fill="#A66A18" />
</svg>
